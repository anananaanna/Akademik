<div class="my-reviews-page">
  <div class="page-header">
    <h1>My Reviews</h1>
  </div>

  <div class="reviews-loading" *ngIf="isLoading">
    <p>Loading reviews...</p>
  </div>

  <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="reviews-empty" *ngIf="!isLoading && reviews.length === 0">
    <p>You have not left any reviews yet.</p>
    <p>Complete a lesson and leave a review from your bookings page.</p>
  </div>

  <div class="reviews-list" *ngIf="!isLoading && reviews.length > 0">
    <div class="review-card" *ngFor="let review of reviews">

      <div *ngIf="editingReviewId !== review.id">
        <div class="review-header">
          <span class="review-stars">{{ getRatingStars(review.rating) }}</span>
          <span class="review-edited" *ngIf="review.isEdited">(edited)</span>
        </div>
        <p class="review-comment" *ngIf="review.comment">{{ review.comment }}</p>
        <p class="no-comment" *ngIf="!review.comment">No comment.</p>
        <div class="review-actions">
          <button class="btn-edit" (click)="startEdit(review)">Edit</button>
          <button
            class="btn-delete"
            (click)="deleteReview(review.id)"
            [disabled]="deletingId === review.id"
          >
            {{ deletingId === review.id ? 'Deleting...' : 'Delete' }}
          </button>
        </div>
      </div>

      <div *ngIf="editingReviewId === review.id">
        <form [formGroup]="editForm" (ngSubmit)="submitEdit(review.id)" novalidate>
          <div class="rating-group">
            <label>Rating</label>
            <div class="rating-selector">
              <button
                type="button"
                class="star-btn"
                *ngFor="let star of [1,2,3,4,5]"
                (click)="editForm.patchValue({ rating: star })"
                [class.active]="editForm.value.rating >= star"
              >★</button>
            </div>
          </div>
          <div class="form-group">
            <label for="edit-comment">Comment (optional)</label>
            <textarea
              id="edit-comment"
              formControlName="comment"
              rows="3"
              placeholder="Share your experience..."
            ></textarea>
          </div>
          <div class="edit-actions">
            <button type="button" class="btn-secondary" (click)="cancelEdit()">Cancel</button>
            <button type="submit" class="btn-primary" [disabled]="isSubmitting">
              {{ isSubmitting ? 'Saving...' : 'Save changes' }}
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
